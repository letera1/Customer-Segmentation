services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: customer-segmentation-api:latest
    container_name: segmentai-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/data/outputs/segmentation_model.pkl
      - SCALER_PATH=/app/data/outputs/scaler.pkl
      - DEBUG=False
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - segmentai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    image: customer-segmentation-frontend:latest
    container_name: segmentai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - segmentai-network

networks:
  segmentai-network:
    driver: bridge
